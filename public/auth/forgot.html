<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lupa password · Terminal Chart</title>
<link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="lock.css"></head><body class="lock lk-sub">
<span class="lk-tray" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19" r="1"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3"/></svg></span>
<div class="lk-time" aria-hidden="true"><div class="lk-date" id="ld"></div><div class="lk-clock" id="lc"></div></div>
<main>
<section class="panel">
 <a class="back" href="login.html">← Kembali ke login</a>
 <div>
  <h1>Lupa password</h1><p class="sub">Masukkan email akun Anda. Kami kirim kode OTP ke email itu untuk verifikasi sebelum Anda membuat password baru.</p>
  <form id="f1" novalidate>
   <label class="fld"><span>Email</span><span class="em"><input name="email" type="text" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="nama" required><span class="sfx">@gmail.com</span></span></label>
   <button class="go" type="submit">Kirim kode OTP</button>
   <p class="err" role="alert"></p>
  </form>
 </div>
</section>
</main>
<script src="../shared/config.js"></script>
<script src="auth.js"></script>
<script src="lock.js"></script>
<script>
(()=>{
const q=s=>document.querySelector(s);Auth.scene();Auth.suffix(document.querySelector('[name=email]'));
const eye=(b,i)=>b.onclick=()=>{const on=i.type==='password';i.type=on?'text':'password';b.textContent=on?'Sembunyikan':'Tampilkan';b.setAttribute('aria-pressed',on)};

const f1=q('#f1');
f1.onsubmit=async e=>{e.preventDefault();const b=f1.querySelector('.go'),er=f1.querySelector('.err');er.textContent='';
 const mail=Auth.mail(f1.email.value),bad=Auth.V.email(mail);if(bad){er.textContent=bad;f1.email.focus();return}
 b.disabled=true;b.textContent='Mengirim…';
 try{await Auth.sendOtp('reset',mail);location.replace('otp.html?p=reset&e='+encodeURIComponent(mail))}
 catch(x){er.textContent=x.message;b.disabled=false;b.textContent='Kirim kode OTP'}};
})();
</script></body></html>
