<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · Terminal Chart</title>
<link rel="stylesheet" href="auth.css"></head><body>
<header class="top"><b>Terminal Chart</b><time id="clk"></time><span class="tray" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19" r="1"/></svg><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/></svg><svg viewBox="0 0 24 24"><path d="M12 3v9M6.5 6.5a8 8 0 1011 0"/></svg></span></header>
<main>
<div class="lg">
 <div class="av" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
 <h1>Selamat datang</h1><p class="sub">Masuk untuk membuka desktop</p>
 <form id="f" novalidate>
  <label class="fld"><span>Username atau email</span><input class="in" name="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label class="fld"><span>Password</span><span class="pw"><input class="in" name="p" type="password" autocomplete="current-password" required><button type="button" class="eye" aria-pressed="false">Tampilkan</button></span></label>
  <label class="rm"><input type="checkbox" name="rm" checked> Ingat saya di perangkat ini</label>
  <button class="go" type="submit">Masuk</button>
  <p class="ok" role="status"></p><p class="err" role="alert"></p>
 </form>
 <nav class="ln" aria-label="Bantuan akun"><a href="register.html">Daftar akun</a><a href="forgot.html">Lupa password?</a></nav>
</div>
</main>
<details class="srv"><summary>Koneksi server</summary><div class="box">
 <label class="fld"><span>Sumber akun</span><select class="in" id="sm"><option value="dummy">Dummy (akun di browser ini)</option><option value="live">Live (backend)</option></select></label>
 <label class="fld" style="margin:0"><span>Base URL</span><input class="in" id="sb" type="url" placeholder="https://api.contoh.id" autocomplete="off" spellcheck="false"></label>
</div></details>
<script src="../shared/config.js"></script>
<script src="auth.js"></script>
<script>
(()=>{
const q=s=>document.querySelector(s);Auth.scene();Auth.clock('clk');
const eye=(b,i)=>b.onclick=()=>{const on=i.type==='password';i.type=on?'text':'password';b.textContent=on?'Sembunyikan':'Tampilkan';b.setAttribute('aria-pressed',on)};

if(Auth.session()){location.replace('../index.html');return}
const f=q('#f'),go=q('.go'),err=q('.err'),ok=q('.ok'),p=new URLSearchParams(location.search);
eye(q('.eye'),f.p);
if(p.get('new'))ok.textContent='Akun berhasil dibuat. Silakan masuk.';
if(p.get('verified'))ok.textContent='Verifikasi berhasil. Akun aktif, silakan masuk.';
if(p.get('reset'))ok.textContent='Password sudah diganti. Silakan masuk.';
f.u.value=p.get('u')||'';(f.u.value?f.p:f.u).focus();
f.onsubmit=async e=>{e.preventDefault();err.textContent='';ok.textContent='';
 const u=f.u.value.trim(),pw=f.p.value;
 if(!u||!pw){err.textContent='Isi username dan password';return}
 go.disabled=true;go.textContent='Memeriksa…';
 try{await Auth.login(u,pw,f.rm.checked);location.replace('../index.html')}
 catch(x){err.textContent=x.message;if(x.unverified){const em=x.email||(u.includes('@')?u.toLowerCase():'');const a=document.createElement('a');a.href='#';a.textContent=' Verifikasi sekarang';a.onclick=async ev=>{ev.preventDefault();try{if(em)await Auth.sendOtp('register',em)}catch(_){}location.href='otp.html?p=register&e='+encodeURIComponent(em)};err.append(a)}f.p.value='';f.p.focus();go.disabled=false;go.textContent='Masuk'}};
// koneksi server (dummy atau live) bisa diatur sebelum login
const sm=q('#sm'),sb=q('#sb');sm.value=CFG.api.mode;sb.value=CFG.api.base;
sm.onchange=()=>{CFG.api.mode=sm.value;cfgSave()};
sb.oninput=()=>{const v=sb.value.trim(),bad=v&&!/^https?:\/\/[^\s/]+/i.test(v);sb.setAttribute('aria-invalid',!!bad);if(!bad){CFG.api.base=v;cfgSave()}};

})();
</script></body></html>
