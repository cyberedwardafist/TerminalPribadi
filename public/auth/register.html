<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar · Terminal Chart</title>
<link rel="stylesheet" href="auth.css"></head><body>
<header class="top"><b>Terminal Chart</b><time id="clk"></time><span class="tray" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19" r="1"/></svg><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/></svg><svg viewBox="0 0 24 24"><path d="M12 3v9M6.5 6.5a8 8 0 1011 0"/></svg></span></header>
<main>
<section class="panel">
 <a class="back" href="login.html">← Kembali ke login</a>
 <h1>Buat akun</h1><p class="sub">Isi data di bawah untuk mendaftar.</p>
 <form id="f" novalidate>
  <div class="two">
   <label class="fld"><span>Nama</span><input class="in" name="name" autocomplete="name" required></label>
   <label class="fld"><span>Username</span><input class="in" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  </div>
  <label class="fld"><span>Email</span><span class="em"><input name="email" type="text" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="nama" required><span class="sfx">@gmail.com</span></span></label>
  <label class="fld"><span>Password</span><span class="pw"><input class="in" name="p" type="password" autocomplete="new-password" required><button type="button" class="eye" aria-pressed="false">Tampilkan</button></span><span class="meter" id="st" data-l="0" role="status"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl"></span></span></label>
  <label class="fld"><span>Ulangi password</span><input class="in" name="p2" type="password" autocomplete="new-password" required></label>
  <button class="go" type="submit">Daftar</button>
  <p class="err" role="alert"></p>
 </form>
</section>
</main>
<script src="../shared/config.js"></script>
<script src="auth.js"></script>
<script>
(()=>{
const q=s=>document.querySelector(s);Auth.scene();Auth.clock('clk');Auth.suffix(document.querySelector('[name=email]'));
const eye=(b,i)=>b.onclick=()=>{const on=i.type==='password';i.type=on?'text':'password';b.textContent=on?'Sembunyikan':'Tampilkan';b.setAttribute('aria-pressed',on)};

const f=q('#f'),go=q('.go'),err=q('.err'),st=q('#st');eye(q('.eye'),f.p);
Auth.meter(f.p,st);
f.onsubmit=async e=>{e.preventDefault();err.textContent='';[...f.elements].forEach(i=>i.removeAttribute&&i.removeAttribute('aria-invalid'));
 const d={name:f.name.value.trim(),username:f.username.value.trim().toLowerCase(),email:Auth.mail(f.email.value),password:f.p.value};
 const chk=[['name',Auth.V.name(d.name)],['username',Auth.V.username(d.username)],['email',Auth.V.email(d.email)],['p',Auth.V.password(d.password)],['p2',f.p2.value===d.password?'':'Password tidak sama']].find(x=>x[1]);
 if(chk){f[chk[0]].setAttribute('aria-invalid','true');f[chk[0]].focus();err.textContent=chk[1];return}
 go.disabled=true;go.textContent='Mendaftar…';
 try{await Auth.register(d);location.replace('otp.html?p=register&e='+encodeURIComponent(d.email))}
 catch(x){err.textContent=x.message;go.disabled=false;go.textContent='Daftar'}};

})();
</script></body></html>
