<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password baru · Terminal Chart</title>
<link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="lock.css"></head><body class="lock lk-sub">
<span class="lk-tray" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19" r="1"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3"/></svg></span>
<div class="lk-time" aria-hidden="true"><div class="lk-date" id="ld"></div><div class="lk-clock" id="lc"></div></div>
<main>
<section class="panel">
 <h1>Buat password baru</h1><p class="sub" id="info"></p>
 <form id="f" novalidate>
  <label class="fld"><span>Password baru</span><span class="pw"><input class="in" name="p" type="password" autocomplete="new-password" required><button type="button" class="eye" aria-pressed="false">Tampilkan</button></span><span class="meter" id="st" data-l="0" role="status"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl"></span></span></label>
  <label class="fld"><span>Ulangi password baru</span><input class="in" name="p2" type="password" autocomplete="new-password" required></label>
  <button class="go" type="submit">Simpan password</button>
  <p class="err" role="alert"></p>
 </form>
</section>
</main>
<script src="../shared/config.js"></script>
<script src="auth.js"></script>
<script src="lock.js"></script>
<script>
(()=>{
const q=s=>document.querySelector(s);Auth.scene();
const eye=(b,i)=>b.onclick=()=>{const on=i.type==='password';i.type=on?'text':'password';b.textContent=on?'Sembunyikan':'Tampilkan';b.setAttribute('aria-pressed',on)};

const mail=(new URLSearchParams(location.search).get('e')||'').toLowerCase();
if(!Auth.canReset(mail)){location.replace('forgot.html');return}
const f=q('#f'),go=q('.go'),err=q('.err'),st=q('#st');eye(q('.eye'),f.p);
q('#info').textContent='OTP terverifikasi untuk '+mail+'.';
Auth.meter(f.p,st);
f.onsubmit=async e=>{e.preventDefault();err.textContent='';
 if(f.p.value!==f.p2.value){err.textContent='Password tidak sama';f.p2.focus();return}
 go.disabled=true;go.textContent='Menyimpan…';
 try{await Auth.reset(mail,f.p.value);location.replace('login.html?reset=1')}
 catch(x){err.textContent=x.message;go.disabled=false;go.textContent='Simpan password'}};

})();
</script></body></html>
