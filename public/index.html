(function(){var L=[
  // Satu folder per item dock. Urutan baris = urutan dock. Hapus satu baris untuk menyembunyikan app itu
  'apps/home/home.js',
  'apps/watchlist/watchlist.js',

];
// Unduh semua script app paralel sejak awal (eksekusi tetap berurutan di bawah) supaya refresh keras tidak menunggu satu per satu.
L.forEach(function(u){var l=document.createElement('link');l.rel='preload';l.as='script';l.href=u;document.head.appendChild(l)});
var go=function(){var m=document.getElementById('mbmode'),set=function(){if(!m)return;var on=window.Live&&Live.on,bad=on&&Live.q&&Live.q.state==='err';m.textContent=!on?'Tidak live':bad?'Terputus':'Live';m.style.color=bad?'var(--dn)':''};addEventListener('tc:quotes',set);addEventListener('tc:qfail',set);set();if(window.Live&&Live.on&&Live.applySettings)Live.applySettings();
 var i=0;(function n(){if(i>=L.length)return;var e=document.createElement('script');e.src=L[i++];e.async=false;e.onload=n;e.onerror=n;document.head.appendChild(e)})()};
(window.Live?Live.ready:Promise.resolve()).then(go,go)})();
</script>
